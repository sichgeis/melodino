[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melodino"
version = "0.1.0"
description = "Noten aus dem Codex-Chat als instrumentale Hörprobe"
requires-python = ">=3.11"
dependencies = ["music21>=9.3,<10", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
notenstimme = "notenstimme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
